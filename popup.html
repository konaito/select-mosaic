<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; width: 260px; font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif; color: #111; background: #fff; }
    main { padding: 12px; display: grid; gap: 8px; }
    h1, h2 { margin: 0; font-size: 13px; font-weight: 600; }
    hr { width: 100%; border: 0; border-top: 1px solid #eee; margin: 4px 0; }
    #status { color: #555; }
    button { all: unset; box-sizing: border-box; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; }
    button:hover { background: #f5f5f5; }
    button:disabled { opacity: .4; cursor: default; }
    button.on { border-color: #2563eb; background: #eff6ff; color: #1d4ed8; font-weight: 600; }
    button small { display: block; color: #777; font-weight: 400; }
    .mode { width: 100%; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .row button { text-align: center; }
    p { margin: 0; color: #777; font-size: 11px; }
    #error { color: #b91c1c; }

    form { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
    input[type=text] { min-width: 0; padding: 6px 8px; border: 1px solid #ddd; border-radius: 6px; font: inherit; }
    input[type=text]:focus { outline: 2px solid #bfdbfe; border-color: #2563eb; }
    form button { padding: 6px 10px; }

    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 180px; overflow-y: auto; }
    li { display: grid; grid-template-columns: 1fr auto; gap: 4px; }
    li .word { display: flex; align-items: center; gap: 6px; padding: 5px 8px; min-width: 0; }
    li .word span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    li .word::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: #d4d4d4; }
    li .word.on::before { background: #2563eb; }
    li .word:not(.on) span { color: #999; text-decoration: line-through; }
    li .del { padding: 5px 9px; color: #777; }
    li .del:hover { color: #b91c1c; }
    #empty { color: #999; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1 data-i18n="extName"></h1>
    <div id="status"></div>
    <button class="mode" id="text"><span data-i18n="modeText"></span><small data-i18n="modeTextHint"></small></button>
    <button class="mode" id="element"><span data-i18n="modeElement"></span><small data-i18n="modeElementHint"></small></button>
    <div class="row">
      <button id="stop" data-i18n="stop"></button>
      <button id="clear" data-i18n="clearAll"></button>
    </div>
    <p data-i18n="hintStop"></p>
    <p id="error" hidden></p>

    <hr>
    <h2 data-i18n="wordsTitle"></h2>
    <form id="add">
      <input type="text" id="word" data-i18n-placeholder="wordPlaceholder" autocomplete="off">
      <button type="submit" data-i18n="add"></button>
    </form>
    <ul id="words"></ul>
    <div id="empty" data-i18n="wordsEmpty"></div>
    <p data-i18n="wordsHint"></p>
  </main>
  <script src="words.js"></script>
  <script src="popup.js"></script>
</body>
</html>
